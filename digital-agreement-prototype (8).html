<style>
:root {
  --bg: #1b4f8c; --surface: #ffffff; --surface-2: #e3ebf4; --border: #c9d6e4;
  --text: #16233a; --text-secondary: #51627d; --text-muted: #8696ac;
  --accent: #c0392b; --accent-bg: #fbe6e3; --on-accent: #ffffff;
  --blue: #0f3260; --blue-contrast: #ffffff;
  --warn: #a9680f; --warn-bg: #f6e9d2;
  --danger: #8c2d1f; --danger-bg: #f5e2df;
  --radius: 9px; --radius-lg: 16px;
  --font-display: 'Lora', Georgia, serif;
  --font-ui: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'IBM Plex Mono', 'SF Mono', Menlo, monospace;
  --shadow: 0 1px 2px rgba(20,30,50,0.05), 0 6px 16px rgba(20,30,50,0.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a1830; --surface: #17213a; --surface-2: #1d2a46; --border: #2c3b5c;
    --text: #e7edf7; --text-secondary: #aab8cf; --text-muted: #7c8aa3;
    --accent: #e35d4f; --accent-bg: #3a1f1c; --on-accent: #ffffff;
    --blue: #2f6cb0; --blue-contrast: #ffffff;
    --warn: #d8a662; --warn-bg: #3a2e18;
    --danger: #d97362; --danger-bg: #3a211c;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 16px rgba(0,0,0,0.35);
  }
}
:root[data-theme="dark"] {
  --bg: #0a1830; --surface: #17213a; --surface-2: #1d2a46; --border: #2c3b5c;
  --text: #e7edf7; --text-secondary: #aab8cf; --text-muted: #7c8aa3;
  --accent: #e35d4f; --accent-bg: #3a1f1c; --on-accent: #ffffff;
  --blue: #2f6cb0; --blue-contrast: #ffffff;
  --warn: #d8a662; --warn-bg: #3a2e18;
  --danger: #d97362; --danger-bg: #3a211c;
  --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 6px 16px rgba(0,0,0,0.35);
}
* { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-ui);
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  min-height: 100%;
}
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px 18px; box-shadow: var(--shadow); }
h2 { font-family: var(--font-display); font-size: 17px; font-weight: 600; margin: 0 0 14px; }
.sub { color: var(--text-secondary); font-size: 13px; margin: 0 0 16px; }
.card { background: var(--surface-2); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; }
input[type=text], input[type=number], input[type=date], select {
  width: 100%; height: 40px; border-radius: var(--radius); border: 1px solid var(--border);
  background: var(--bg); color: var(--text); padding: 0 12px; font-size: 14px; font-family: var(--font-ui);
  transition: border-color .15s ease;
}
input:focus, select:focus { outline: none; border-color: var(--accent); }
input:disabled, select:disabled { opacity: 0.5; }
.choices { display: flex; gap: 8px; flex-wrap: wrap; }
.choices button {
  flex: 1; min-width: 100px; padding: 10px; border-radius: var(--radius); border: 1px solid var(--border);
  background: var(--bg); color: var(--text); font-size: 13.5px; cursor: pointer; font-family: var(--font-ui);
  transition: border-color .15s ease, color .15s ease, background .15s ease;
}
.choices button.sel { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }
.err { color: var(--danger); font-size: 12.5px; margin-top: 6px; display: none; }
.btnrow { display: flex; gap: 8px; margin-top: 4px; }
.btn {
  flex: 1; height: 42px; border-radius: var(--radius); border: 1px solid var(--border); cursor: pointer;
  font-size: 14px; background: var(--surface); color: var(--text); font-family: var(--font-ui);
  transition: border-color .15s ease, transform .1s ease;
}
.btn:hover { border-color: var(--accent); transform: translateY(-1px); }
.btn:active { transform: translateY(0) scale(0.97); }
.btn.primary { background: var(--accent); color: var(--on-accent); border: none; font-weight: 500; }
.btn.primary:hover { opacity: 0.94; box-shadow: 0 6px 14px rgba(192,57,43,0.28); }
.btn.primary:active { box-shadow: none; }
.progress { height: 3px; background: var(--surface-2); border-radius: 2px; overflow: hidden; margin-bottom: 16px; }
.progress > div { height: 100%; background: var(--accent); transition: width .2s ease; }
.clause { background: var(--surface-2); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 8px; }
.clause .kicker { font-size: 11px; color: var(--text-muted); margin: 0 0 6px; }
.clause .legal { font-size: 13px; color: var(--text-secondary); margin: 0; }
.clause .plainkicker { font-size: 11px; color: var(--accent); margin: 10px 0 4px; }
.clause .plain { font-size: 14px; margin: 0; font-family: var(--font-display); }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; margin-bottom: 12px; }
.badge { display: inline-block; font-size: 11px; padding: 3px 10px; border-radius: 999px; font-family: var(--font-ui); }
.badge.draft { background: var(--surface-2); color: var(--text-secondary); }
.badge.pending { background: var(--warn-bg); color: var(--warn); }
.badge.executed { background: var(--accent-bg); color: var(--accent); }
.timeline { border-left: 1px solid var(--border); padding-left: 14px; display: flex; flex-direction: column; gap: 12px; }
.timeline .t-time { font-size: 11px; color: var(--text-muted); margin: 2px 0 0; }
.code { font-family: var(--font-mono); font-size: 15px; letter-spacing: 0.3px; }
.result-ok { background: var(--accent-bg); color: var(--accent); border-radius: var(--radius); padding: 14px; }
.result-bad { background: var(--danger-bg); color: var(--danger); border-radius: var(--radius); padding: 14px; }
.hint { font-size: 11.5px; color: var(--text-muted); margin-top: 12px; }
.typetile {
  display: flex; align-items: center; justify-content: space-between; width: 100%;
  padding: 13px 14px; border-radius: var(--radius); border: 1px solid var(--border);
  background: var(--surface); color: var(--text); cursor: pointer; margin-bottom: 8px; font-family: var(--font-ui);
  text-align: left; transition: border-color .15s ease;
}
.typetile:hover { border-color: var(--accent); }
.typetile .name { font-size: 14px; }
.typetile .avail { font-size: 10.5px; padding: 3px 9px; border-radius: 999px; background: var(--accent-bg); color: var(--accent); }
.typetile .val { font-size: 12px; color: var(--text-muted); }
#app > p.sub { color: rgba(255,255,255,0.88); }
.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
  background: var(--text); color: #ffffff; font-size: 13px; padding: 10px 16px;
  border-radius: var(--radius); opacity: 0; transition: opacity 0.25s; pointer-events: none;
}
.toast.show { opacity: 0.95; }
.policy p, .policy li { font-size: 13px; color: var(--text-secondary); line-height: 1.6; }
.policy h3 { font-family: var(--font-display); font-size: 14.5px; margin: 16px 0 6px; color: var(--text); }
.policy h3:first-child { margin-top: 0; }
footer.note { text-align: center; font-size: 11.5px; color: rgba(255,255,255,0.65); margin-top: auto; padding-top: 36px; }
footer.note .flinks button { color: rgba(255,255,255,0.75); }
footer.note .flinks button:hover { color: #fff; }
.linklike { background: none; border: none; color: var(--text-muted); font-size: 11.5px; cursor: pointer; text-decoration: underline; font-family: var(--font-ui); padding: 0; }
.linklike:hover { color: var(--accent); }
.flinks{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin-bottom:10px}
.flinks button{background:none;border:none;color:var(--text-secondary);font-size:12px;cursor:pointer;text-decoration:underline;font-family:var(--font-ui);padding:2px}
.flinks button:hover{color:var(--accent)}
.legal h3{font-family:var(--font-display);font-size:14px;font-weight:600;margin:16px 0 4px}
.legal p{font-size:13px;line-height:1.55;color:var(--text-secondary);margin:0}
.legal p.hint{margin-top:18px}

/* entrance polish: every freshly-rendered panel eases in */
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.panel { animation: fadeIn .28s ease; }
.card, .typetile { transition: border-color .15s ease, transform .14s ease, box-shadow .15s ease; }
.card:hover, .typetile:hover { transform: translateY(-2px) scale(1.01); box-shadow: var(--shadow); }

/* ================= layout: a real left sidebar (slide-in drawer on phones) ================= */
.shell { max-width: 100%; margin: 0; padding: 0; }
.main-col { display: flex; flex-direction: column; padding: 8px 16px 20px; max-width: 760px; margin: 0 auto;
  min-height: calc(100vh - 66px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  min-height: calc(100dvh - 66px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); }
.toast { z-index: 100; }

/* phone top bar with the menu button */
.topbar { height: 66px; display: flex; align-items: center; gap: 12px; padding: 0 16px; position: sticky; top: 0; z-index: 30; background: var(--blue); }
.topbar-logo { width: 36px; height: 36px; border-radius: 9px; background: #fff; flex-shrink: 0; }
.topbar-name { font-family: var(--font-display); font-weight: 600; font-size: 14px; letter-spacing: 0.04em; text-transform: uppercase; color: #fff; }
.menu-toggle { display: inline-flex; align-items: center; justify-content: center; width: 42px; height: 42px; flex-shrink: 0;
  border-radius: var(--radius); border: 1px solid rgba(255,255,255,0.35); background: rgba(255,255,255,0.1);
  color: #fff; font-size: 20px; cursor: pointer; transition: background .15s ease, transform .12s ease; }
.menu-toggle:hover { background: rgba(255,255,255,0.22); }
.menu-toggle:active { transform: scale(0.94); }
.scrim { position: fixed; inset: 0; background: rgba(5,15,35,0.55); opacity: 0; pointer-events: none; transition: opacity .25s ease; z-index: 40; }
body.menu-open .scrim { opacity: 1; pointer-events: auto; }

/* the sidebar itself: off-canvas on phones, permanent on laptops */
.sidebar { position: fixed; top: 0; left: 0; bottom: 0; width: min(84vw, 320px); z-index: 50;
  background: var(--blue); padding: 32px 22px 24px; overflow-y: auto; display: flex; flex-direction: column;
  transform: translateX(-104%); transition: transform .28s ease, box-shadow .28s ease; }
body.menu-open .sidebar { transform: translateX(0); box-shadow: 8px 0 30px rgba(0,0,0,0.28); }

/* large logo + name */
.brandhead { display: flex; flex-direction: column; align-items: flex-start; gap: 18px; margin-bottom: 32px; }
.brandhead img { width: 96px; height: 96px; border-radius: 22px; background: #fff; flex-shrink: 0; box-shadow: 0 6px 18px rgba(0,0,0,0.3); }
.wordmark { font-family: var(--font-display); font-weight: 600; font-size: 28px; margin: 0; letter-spacing: 0.04em; line-height: 1.2; color: #fff; text-wrap: balance; text-transform: uppercase; }
.tagline { font-family: var(--font-display); font-style: italic; font-size: 14.5px; color: rgba(255,255,255,0.75); margin: 8px 0 0; line-height: 1.4; text-wrap: balance; }

/* sidebar tabs with a clear hover effect */
#nav-slot nav { display: flex; flex-direction: column; gap: 6px; }
#nav-slot nav button { text-align: left; font-size: 15.5px; padding: 14px 18px; border-radius: 12px; border: none;
  background: transparent; color: rgba(255,255,255,0.82); cursor: pointer; font-family: var(--font-ui);
  transition: background .18s ease, color .18s ease, transform .18s ease, box-shadow .18s ease; }
#nav-slot nav button:hover { background: rgba(255,255,255,0.15); color: #fff; transform: translateX(6px); box-shadow: inset 4px 0 0 var(--accent); }
#nav-slot nav button:active { transform: translateX(6px) scale(0.98); }
#nav-slot nav button.on { background: #fff; color: var(--blue); font-weight: 600; box-shadow: inset 5px 0 0 var(--accent); }
#nav-slot nav button.on:hover { background: #fff; color: var(--blue); }

/* ---------- laptops and desktops: sidebar always visible, content fills the rest ---------- */
@media (min-width: 860px) {
  .topbar, .scrim { display: none; }
  .sidebar { transform: none; width: 310px; padding: 40px 26px 28px; box-shadow: 6px 0 24px rgba(0,0,0,0.2); z-index: 20; }
  .main-col { margin-left: 310px; max-width: none; padding: 52px 56px 28px; min-height: 100vh; min-height: 100dvh; }
  .main-col > * { max-width: 1240px; }
  .main-col footer.note { max-width: none; }
  .panel { padding: 36px 42px; }
  h2 { font-size: 22px; }
  .sub { font-size: 14.5px; }
  .tile-grid, .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; }
  .tile-grid .typetile, .card-grid .card { margin-bottom: 0; }
  .tile-grid .typetile { padding: 18px; }
}
@media (min-width: 1280px) {
  .sidebar { width: 350px; padding: 48px 32px 32px; }
  .main-col { margin-left: 350px; padding: 60px 72px 28px; }
  .brandhead img { width: 120px; height: 120px; border-radius: 26px; }
  .wordmark { font-size: 34px; }
  .tagline { font-size: 15.5px; }
  #nav-slot nav button { font-size: 16.5px; padding: 16px 20px; }
  .panel { padding: 44px 50px; }
  h2 { font-size: 24px; }
}

/* ===== clocks, statuses, agreement page ===== */
:root { --ok: #1b7a4b; --ok-bg: #e0f3e8; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ok: #6ad39a; --ok-bg: #16352a; } }
.badge.executed { background: var(--ok-bg); color: var(--ok); }
.badge.expired { background: var(--danger-bg); color: var(--danger); }
.result-ok { background: var(--ok-bg); color: var(--ok); }
.result-wait { background: var(--warn-bg); color: var(--warn); border-radius: var(--radius); padding: 14px; }
.cd { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.cd.late { color: var(--danger); }
.cd-big { display: block; font-size: 26px; font-weight: 500; letter-spacing: .02em; margin: 4px 0 2px; }
.clock { background: var(--surface-2); border-radius: var(--radius); padding: 14px 16px; margin: 14px 0; }
.clock-label { font-size: 12px; color: var(--text-secondary); margin: 0; }
.who { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 13px; padding: 8px 0; border-bottom: 1px solid var(--border); }
.who .role { color: var(--text-muted); font-size: 11.5px; margin-left: 6px; }
.who .state { color: var(--text-secondary); font-size: 12px; }
.card.clickable { cursor: pointer; }
</style>
</head>

let kenyaCounties = kenyaCountiesFallback;
let WARD_DATA = WARD_DATA_FALLBACK;
let countyIds = {}, subcountyIds = {}, wardIdFromName = {};

async function loadLocationsFromDB() {
  if (!sb) return;
  try {
    const [{ data: counties, error: e1 }, { data: subs, error: e2 }, { data: wardRows, error: e3 }] = await Promise.all([
      sb.from('counties').select('id,name'),
      sb.from('subcounties').select('id,name,counties(name)'),
      sb.from('wards').select('id,name,subcounties(name,counties(name))')
    ]);
    if (e1 || e2 || e3 || !counties || !subs) throw (e1 || e2 || e3 || new Error('empty response'));
    const newCounties = {}, newWards = {};
    countyIds = {}; subcountyIds = {}; wardIdFromName = {};
    counties.forEach(c => { newCounties[c.name] = []; countyIds[c.name] = c.id; });
    subs.forEach(s => {
      const cname = s.counties && s.counties.name; if (!cname) return;
      (newCounties[cname] = newCounties[cname] || []).push(s.name);
      subcountyIds[cname] = subcountyIds[cname] || {}; subcountyIds[cname][s.name] = s.id;
    });
    (wardRows || []).forEach(w => {
      const sc = w.subcounties, cname = sc && sc.counties && sc.counties.name, sname = sc && sc.name;
      if (!cname || !sname) return;
      newWards[cname] = newWards[cname] || {}; newWards[cname][sname] = newWards[cname][sname] || [];
      newWards[cname][sname].push(w.name);
      wardIdFromName[cname] = wardIdFromName[cname] || {}; wardIdFromName[cname][sname] = wardIdFromName[cname][sname] || {};
      wardIdFromName[cname][sname][w.name] = w.id;
    });
    kenyaCounties = newCounties; WARD_DATA = newWards;
    if (state.view === 'send') render();
  } catch (e) { console.warn('Live location data unavailable, using built-in list:', e); }
}
function resolveLocationIds(county, sub, ward) {
  return {
    county_id: countyIds[county] || null,
    subcounty_id: (subcountyIds[county] && subcountyIds[county][sub]) || null,
    ward_id: (wardIdFromName[county] && wardIdFromName[county][sub] && wardIdFromName[county][sub][ward]) || null
  };
}

/* ===== every agreement ends with "by what date should it be fulfilled?" =====
   The date is suggested from what was already entered (repayment date, delivery date, lease end...)
   and must be chosen by hand when the agreement has no natural end (partnership, employment...). */
const fulfilDefaults = {
  loan: a => {
    if (a.repayment_type === 'lump_sum') return a.repayment_date || '';
    if (a.repayment_type === 'installments' && a.first_installment_date && a.installment_count) {
      const n = Math.max(0, Number(a.installment_count) - 1);
      return a.installment_frequency === 'weekly' ? addDaysYMD(a.first_installment_date, 7 * n)
           : addMonthsYMD(a.first_installment_date, (a.installment_frequency === 'quarterly' ? 3 : 1) * n);
    }
    return '';
  },
  rental: a => a.lease_type === 'fixed_term' ? (a.lease_end_date || '') : '',
  sale: a => a.payment_terms === 'deposit_balance' ? laterYMD(a.delivery_date, a.balance_due_date) : (a.delivery_date || ''),
  freelance: a => a.deadline || ''

    defaultFrom: fulfilDefaults[id] || (() => '') });

      plain: `Both sides have until the end of ${longDate(a.fulfil_by)} to finish what they agreed. When it is done, each side confirms it on the platform. The agreement only counts as complete when both have confirmed.` });

function nowMs() { return Date.now() + (state.clockOffset || 0); }
function pad2(n) { return String(n).padStart(2, '0'); }
function fmtDur(ms, withDays) {
  let s = Math.max(0, Math.floor(ms / 1000)); let d = 0;
  if (withDays) { d = Math.floor(s / 86400); s -= d * 86400; }
  const hh = Math.floor(s / 3600); s -= hh * 3600;
  const mm = Math.floor(s / 60); s -= mm * 60;
  return (withDays ? d + 'd ' : '') + pad2(hh) + 'h ' + pad2(mm) + 'm ' + pad2(s) + 's';
}
function cdState(deadlineISO, kind) {
  const diff = Date.parse(deadlineISO) - nowMs();
  if (diff > 0) return { text: fmtDur(diff, kind === 'fulfil'), late: false };
  if (kind === 'sign') return { text: 'Expired', late: true };
  return { text: 'Overdue by ' + fmtDur(-diff, true), late: true };
}

function tickCountdowns() {

    if (el.textContent !== s.text) el.textContent = s.text;
    el.classList.toggle('late', s.late);

function photoExt(file) { const m = /\.([a-zA-Z0-9]+)$/.exec(file && file.name || ''); return (m ? m[1] : 'jpg').toLowerCase(); }

async function persistAgreementAndFirstSignature(creatorIdNumber, creatorPhotoFile) {
  if (!sb || !state.session) return;
  try {
    const userId = state.session.user.id;
    const creatorEmail = state.session.user.email;
    const agreementId = crypto.randomUUID();
    const firstPartyId = crypto.randomUUID();
    const secondPartyId = crypto.randomUUID();
    const rc = state.recipientContact;
    const loc = resolveLocationIds(rc.county, rc.subcounty, rc.ward);

    const { error: ea } = await sb.from('agreements').insert({
      id: agreementId, reference_code: state.code, type_id: state.typeId, creator_id: userId, jurisdiction: 'KEN',
      fulfil_due_at: state.answers.fulfil_by ? state.answers.fulfil_by + 'T23:59:59' + KENYA_UTC_OFFSET : null
    });
    if (ea) throw ea;
    // storage only accepts photos for an agreement that already exists, so upload after creating it
    const firstPhotoPath = await uploadPartyPhoto(creatorPhotoFile, `${agreementId}/${firstPartyKeyMap[state.typeId]}.${photoExt(creatorPhotoFile)}`);
    const secondPhotoPath = await uploadPartyPhoto(rc.photoFile, `${agreementId}/${secondPartyKeyMap[state.typeId]}.${photoExt(rc.photoFile)}`);
    const { error: ep } = await sb.from('parties').insert([
      { id: firstPartyId, agreement_id: agreementId, user_id: userId, full_name: displayName(), email: creatorEmail, role: firstPartyKeyMap[state.typeId], photo_path: firstPhotoPath },
      { id: secondPartyId, agreement_id: agreementId, full_name: rc.name, email: rc.email, phone: rc.phone, role: secondPartyKeyMap[state.typeId],
        county_id: loc.county_id, subcounty_id: loc.subcounty_id, ward_id: loc.ward_id, ward_name: rc.ward,
        contact_consent_at: new Date().toISOString(), photo_path: secondPhotoPath }
    ]);
    if (ep) throw ep;
    await sb.rpc('register_party_id_number', { p_party_id: firstPartyId, p_id_number: creatorIdNumber });
    await sb.rpc('register_party_id_number', { p_party_id: secondPartyId, p_id_number: rc.idNumber });

    const answerRows = Object.keys(state.answers).map(slot_id => ({ agreement_id: agreementId, slot_id, value: JSON.stringify(state.answers[slot_id]) }));
    if (answerRows.length) { const { error: ean } = await sb.from('answers').insert(answerRows); if (ean) throw ean; }
    const clauseRows = agreementTypes[state.typeId].clauses(state.answers).map(c => ({
      agreement_id: agreementId, template_id: c.title.toLowerCase().replace(/[^a-z0-9]+/g, '_'), legal_text: c.legal, plain_text: c.plain
    }));
    if (clauseRows.length) { const { error: ec } = await sb.from('clauses').insert(clauseRows); if (ec) throw ec; }
    const { error: es } = await sb.from('signatures').insert({ agreement_id: agreementId, party_id: firstPartyId, reviewed: true, understood: true });
    if (es) throw es;

    const witnesses = (state.witnesses || []).slice(0, state.witnessCount).filter(w => w && w.name && w.idNumber);
    for (let i = 0; i < witnesses.length; i++) {
      const w = witnesses[i];
      const wPartyId = crypto.randomUUID();
      const wPhotoPath = await uploadPartyPhoto(w.photoFile, `${agreementId}/witness_${i + 1}.${photoExt(w.photoFile)}`);
      w._photoPath = wPhotoPath;
      const { error: ew } = await sb.from('parties').insert({
        id: wPartyId, agreement_id: agreementId, full_name: w.name, email: `witness${i + 1}.${agreementId}@no-reply.local`,
        role: `witness_${i + 1}`, party_type: 'witness', photo_path: wPhotoPath
      });
      if (ew) { console.warn('Could not save witness', i + 1, ew); continue; }
      await sb.rpc('register_party_id_number', { p_party_id: wPartyId, p_id_number: w.idNumber });
      await sb.from('signatures').insert({ agreement_id: agreementId, party_id: wPartyId, reviewed: true, understood: true, method: 'witness_attestation' });
    }

    const photoMap = { [firstPartyKeyMap[state.typeId]]: firstPhotoPath, [secondPartyKeyMap[state.typeId]]: secondPhotoPath };
    witnesses.forEach((w, i) => { if (w._photoPath) photoMap['witness_' + (i + 1)] = w._photoPath; });
    state.dbIds = { userId, agreementId, firstPartyId, secondPartyId, photos: photoMap };
    state.saved = true;
    await refreshCurrentStatus();
    showToast(`Saved. ${secondPartyName()} has 24 hours to sign.`);
  } catch (e) {
    console.warn('Could not save this agreement to the database:', e);
    const msg = (e && e.message) || '';
    showToast(/daily limit/i.test(msg) ? 'Daily limit reached: you can create up to 20 agreements every 24 hours.'
      : /row-level security/i.test(msg) ? 'Could not save. Check that your email address has been confirmed.'
      : 'Saved on this device only — could not reach the database.');
  }
}
async function loadDashboard() {
  if (!sb || !state.session) return;

    else if (eff === 'fulfilled') line = `Fulfilled ${esc(fmtDT(a.fulfilled_at))}`;

  return `<div class="panel"><h2>${title} (${shown.length})</h2>

    <label class="check"><input type="checkbox" id="c1"> I have reviewed this amendment.</label>
    <label class="check"><input type="checkbox" id="c2"> I understand that I am signing this document.</label>
    <p class="err" id="sign-err">Check both boxes to continue.</p>
    <button class="btn primary" id="sign-btn" style="width:100%;">Sign amendment</button></div>`;
  document.querySelectorAll('[data-nav]').forEach(b => b.onclick = () => { state.view = b.dataset.nav; render(); });
  document.getElementById('sign-btn').onclick = () => {
    if (!document.getElementById('c1').checked || !document.getElementById('c2').checked) {
      document.getElementById('sign-err').style.display = 'block'; return;
    }
    state.amendment.status = 'signed_by_me'; logEvent('You signed the amendment');
    state.view = 'detail'; render();
  };
}
function verificationHTML(d) {
  const r = t => `<p style="font-size:12.5px;margin:2px 0;">${t}</p>`;
  const head = (cls, t) => `<div class="${cls}"><p style="font-weight:500;margin:0 0 6px;">${t}</p>` + r(`Type: ${esc(d.agreement_type)}`);
  const witnesses = d.witnesses_count ? `${d.witnesses_count} witness(es) attested` : 'No witnesses recorded';
  if (d.fulfilled_at) return head('result-ok', 'Verified — completed')
    + r(`All ${d.parties_required} parties signed on ${esc(fmtDT(d.signed_at))}`)
    + r(`Every party confirmed it was fulfilled on ${esc(fmtDT(d.fulfilled_at))}`)
    + r(witnesses) + r(`Created: ${esc(fmtDT(d.created_at))}`) + `</div>`;
  if (d.status === 'executed') return head('result-ok', 'Verified — signed by everyone, in force')
    + r(`All ${d.parties_required} parties signed on ${esc(fmtDT(d.signed_at))}`)
    + (d.fulfil_due_at ? r(`Fulfilment due by the end of ${esc(fmtDate(d.fulfil_due_at))}`) + r(`Time left to fulfil: ${cdHTML(d.fulfil_due_at, 'fulfil')}`) : r('No fulfilment date was set'))
    + r(`Fulfilment confirmed by ${d.fulfilments_confirmed} of ${d.parties_required} parties`)
    + r(witnesses) + r(`Created: ${esc(fmtDT(d.created_at))}`) + `</div>`;
  if (d.status === 'expired') return head('result-bad', 'Expired — never fully signed')
    + r(`Only ${d.parties_signed} of ${d.parties_required} parties signed within 24 hours, so this agreement never came into force.`)
    + r(`Created: ${esc(fmtDT(d.created_at))}`) + `</div>`;
  return head('result-wait', 'Found — awaiting signatures')
    + r(`${d.parties_signed} of ${d.parties_required} parties have signed.`)
    + (d.sign_deadline ? r(`Time left to sign: ${cdHTML(d.sign_deadline, 'sign')}`) : '')
    + r('Full details are only visible to the parties.') + `</div>`;
}
function initAuth() {
  syncServerClock();
  const params = new URLSearchParams(location.search);
  const signId = params.get('sign');
  if (signId) { state.openAgreementId = signId; state.view = 'agreement'; }
  if (!sb) { render(); return; }
  const fallbackTimer = setTimeout(() => {
    if (!state.session && !state.offlineMode) {
      state.offlineMode = true;
      showToast('Could not reach the login service here — switched to local demo mode.');
      render();
    }
  }, 5000);
  sb.auth.onAuthStateChange((_event, session) => {
    clearTimeout(fallbackTimer);
    state.session = session;
    if (session && state.view === 'agreement' && state.openAgreementId && !state.agreementView) loadAgreementView(state.openAgreementId);
    else render();
  });
  sb.auth.getSession().then(({ data }) => {
    clearTimeout(fallbackTimer);
    state.session = data.session;
    if (data.session && state.view === 'agreement' && state.openAgreementId && !state.agreementView) loadAgreementView(state.openAgreementId);
    else render();
  }).catch(() => {
    clearTimeout(fallbackTimer);
    state.offlineMode = true;
    showToast('Could not reach the login service here — switched to local demo mode.');
    render();
  });
}
loadLocationsFromDB();
initAuth();
</script>
